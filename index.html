<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroid Visualization Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="visualizer-canvas"></canvas>

    <div class="panel control-panel">
        <header class="panel-header">
            <h2>Asteroid Visualizer</h2>
            <button class="panel-toggle" aria-label="Toggle Controls Panel">&#9650;</button>
        </header>
        <div class="panel-content">
            <div class="form-group">
                <label for="start-date" class="form-label">Start Date:</label>
                <input type="date" id="start-date" class="form-input">
            </div>
            <div class="form-group">
                <label for="end-date" class="form-label">End Date:</label>
                <input type="date" id="end-date" class="form-input">
            </div>
            <div class="status" id="status-display">Ready</div>
            <button id="fetch-asteroids" class="btn btn--fetch">Fetch Asteroids</button>
        </div>
    </div>

    <div class="panel view-controls-toolbar">
        <button id="pause-resume" class="btn">Pause</button>
        <button id="slow-down" class="btn">Slower</button>
        <button id="speed-up" class="btn">Faster</button>
        <button id="reset-view" class="btn">Reset View</button>
    </div>

    <button class="search-toggle-btn" id="search-toggle-btn" aria-label="Open Search Drawer">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M10 18a7.952 7.952 0 0 0 4.897-1.688l4.396 4.396 1.414-1.414-4.396-4.396A7.952 7.952 0 0 0 18 10c0-4.411-3.589-8-8-8s-8 3.589-8 8 3.589 8 8 8zm0-14c3.309 0 6 2.691 6 6s-2.691 6-6 6-6-2.691-6-6 2.691-6 6-6z"></path></svg>
        <span>Search</span>
    </button>
    
    <div class="panel search-drawer" id="search-drawer">
        <div class="drawer-header">
            <h3>Search Asteroids</h3>
            <button class="drawer-close-btn" id="drawer-close-btn" aria-label="Close Search Drawer">&times;</button>
        </div>
        <div class="form-group">
            <input type="text" id="search-input" class="form-input" placeholder="Search by name...">
        </div>
        <div class="search-results" id="search-results">
            </div>
    </div>

    <div class="panel info-panel" id="info-panel">
         <header class="panel-header">
            <h3>Asteroid Details</h3>
            <button class="panel-toggle" aria-label="Toggle Info Panel">&#9650;</button>
        </header>
        <div class="panel-content">
            <div id="asteroid-info">
                <p><strong>Name:</strong> <span id="asteroid-name">-</span></p>
                <p><strong>Size (est.):</strong> <span id="asteroid-size">-</span></p>
                <p><strong>Miss Distance:</strong> <span id="asteroid-distance">-</span></p>
                <p><strong>Velocity:</strong> <span id="asteroid-velocity">-</span></p>
                <p><strong>Close Approach:</strong> <span id="asteroid-approach">-</span></p>
            </div>
            <button id="close-info" class="btn btn--danger">Close</button>
        </div>
    </div>

    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
